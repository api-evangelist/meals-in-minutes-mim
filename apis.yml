aid: meals-in-minutes-mim
name: Meals In Minutes, MIM
description: >-
  Meals In Minutes (MIM) is a direct-to-consumer healthy meal company that sells
  portioned, prepped, vacuum-packed meal components — mix-and-match proteins, bases,
  and sides — delivered to the customer's door. The storefront at mealsinminutes.co
  runs on Shopify and is backed by 500 Global. While MIM publishes no bespoke
  developer API, its Shopify store natively exposes an agent-commerce surface: a
  Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a hosted
  MCP endpoint at /api/ucp/mcp for buyer-approved agent checkout, Shopify Customer
  Accounts OpenID Connect (with a customer-account-mcp-api scope), a published
  /llms.txt and /agents.md with agent instructions, and the standard Shopify
  storefront product/collection JSON endpoints. This profile captures that
  agent-facing surface for the API Evangelist network.
