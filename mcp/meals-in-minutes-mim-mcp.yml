description: Meals In Minutes runs on Shopify and natively exposes a Universal Commerce Protocol (UCP)
  agent-commerce surface. A hosted MCP server accepts JSON-RPC POSTs at https://mealsinminutes.co/api/ucp/mcp
  (Content-Type application/json); agents call tools/list to discover the tool schemas after presenting
  a UCP agent profile. The store advertises supported UCP versions 2026-04-08 (latest) and 2026-01-23.
  Checkout requires contemporaneous human buyer approval; the endpoint is rate-limited per IP (back off
  on 429). This is a platform-provided (Shopify UCP) surface, live on the merchant's own domain — not
  a bespoke first-party API.
